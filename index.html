<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small JavaScript playground for learning generative art with noise."
    />
    <link rel="icon" href="/favicon.svg" />
    <title>Genart Playground</title>
  </head>
  <body>
    <main class="studio">
      <aside class="sidebar">
        <p class="eyebrow">Genart playground</p>
        <h1>Noise, made visible.</h1>

        <div class="control">
          <label for="sketch">Sketch</label>
          <select id="sketch"></select>
          <p class="description" id="description"></p>
        </div>

        <div class="control">
          <div class="control-row"><label for="seed">Seed</label></div>
          <div class="seed-row">
            <input id="seed" value="workshop" />
            <button type="button" id="randomize" aria-label="Choose a random seed">↻</button>
          </div>
        </div>

        <div class="control">
          <div class="control-row">
            <label for="scale">Scale · frequency</label>
            <output id="scale-value">3.0</output>
          </div>
          <input id="scale" type="range" min="0.2" max="10" step="0.1" value="3" />
        </div>

        <div class="control">
          <div class="control-row">
            <label for="strength">Strength · amplitude</label>
            <output id="strength-value">1.0</output>
          </div>
          <input id="strength" type="range" min="0" max="2.5" step="0.1" value="1" />
        </div>

        <div class="sketch-controls" id="sketch-controls"></div>

        <div class="actions">
          <button type="button" id="secondary-action" hidden>Pause</button>
          <button type="button" class="primary" id="export">Export PNG</button>
          <button type="button" class="wide" id="record-webm" hidden>
            Record 6s WebM
          </button>
        </div>
        <p class="hint">
          Press S to export. Copy <code>sketches/template.js</code> to start a
          sketch of your own.
        </p>
      </aside>

      <section class="canvas-area" aria-label="Sketch preview">
        <div class="canvas-frame"><canvas id="canvas"></canvas></div>
        <div class="toast" id="toast" role="status" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
